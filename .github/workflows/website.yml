name: Deploy documentation site

on:
  workflow_run:
    workflows: ["Release CI"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build and check documentation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Test website tooling
        working-directory: website
        run: npm test
      - name: Check documentation
        working-directory: website
        run: npm run check
      - name: Build documentation
        working-directory: website
        run: npm run build

  deploy_pages:
    name: Deploy documentation to GitHub Pages
    if: ${{ (github.event_name != 'workflow_run' && github.event_name != 'pull_request') || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOCS_SITE: https://${{ github.repository_owner }}.github.io
      DOCS_BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Fix Gradle wrapper permissions
        run: chmod +x ./gradlew
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Install preview browser
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Build and verify live previews
        working-directory: website
        run: npm run previews:live
      - name: Test website tooling
        working-directory: website
        run: npm test
      - name: Check documentation
        working-directory: website
        run: npm run check
      - name: Build documentation
        working-directory: website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
