name: Nightly CI

on:
  push:
   branches:
    - nightly

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versionCode: ${{ steps.versioncode.outputs.versionCode }}
      versionName: ${{ steps.versionname.outputs.versionName }}
    steps:
      - uses: actions/checkout@v6
      - name: Get versionCode
        id: versioncode
        run: echo "versionCode=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | awk '{ print $3 }' | head -n 1)" >> $GITHUB_OUTPUT
      - name: Get versionName
        id: versionname
        run: echo "versionName=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | head -1 | awk -F\" '{ print $2 }')" >> $GITHUB_OUTPUT

  build_offline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [Arm64-v8a, Armeabi-v7a, X86_64, X86, Universal]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Fix permissions
        run: chmod +x ./gradlew
      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Enable offline mode
        run: echo "OFFLINE=true" >> ./app.properties
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'release_key.jks'
          fileDir: 'app/'
          encodedString: ${{ secrets.SIGNING_KEY }}
      - name: Build Release APK
        run: ./gradlew --build-cache :app:assemble${{ matrix.arch }}NoMLRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      - name: Verify 16 KB alignment
        if: matrix.arch == 'Arm64-v8a' || matrix.arch == 'X86_64' || matrix.arch == 'Universal'
        run: |
          for apk in app/build/outputs/apk-renamed/*/*/*.apk; do
            scripts/verify-16kb-alignment.sh "$apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: offline-${{ matrix.arch }}
          path: app/build/outputs/apk-renamed/**/*.apk

  build_withml:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [Arm64-v8a, Armeabi-v7a, X86_64, X86, Universal]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Fix permissions
        run: chmod +x ./gradlew
      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Enable offline mode
        run: echo "OFFLINE=true" >> ./app.properties
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'release_key.jks'
          fileDir: 'app/'
          encodedString: ${{ secrets.SIGNING_KEY }}
      - name: Build Release APK
        run: ./gradlew --build-cache :app:assemble${{ matrix.arch }}WithMLRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      - name: Verify 16 KB alignment
        if: matrix.arch == 'Arm64-v8a' || matrix.arch == 'X86_64' || matrix.arch == 'Universal'
        run: |
          for apk in app/build/outputs/apk-renamed/*/*/*.apk; do
            scripts/verify-16kb-alignment.sh "$apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: withml-${{ matrix.arch }}
          path: app/build/outputs/apk-renamed/**/*.apk

  build_maps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [Arm64-v8a, Armeabi-v7a, X86_64, X86, Universal]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
      - name: Fix permissions
        run: chmod +x ./gradlew
      - name: Tune Gradle for CI
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'release_key.jks'
          fileDir: 'app/'
          encodedString: ${{ secrets.SIGNING_KEY }}
      - name: Build Release APK
        run: test -n "$CARTO_BASEMAP_KEY" && ./gradlew --build-cache :app:assemble${{ matrix.arch }}NoMLRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
      - name: Verify 16 KB alignment
        if: matrix.arch == 'Arm64-v8a' || matrix.arch == 'X86_64' || matrix.arch == 'Universal'
        run: |
          for apk in app/build/outputs/apk-renamed/*/*/*.apk; do
            scripts/verify-16kb-alignment.sh "$apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: maps-${{ matrix.arch }}
          path: app/build/outputs/apk-renamed/**/*.apk

  release:
    needs: [prepare, build_offline, build_withml, build_maps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.versionName }}-${{ needs.prepare.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/VARIANT_INFO.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          pattern: offline-*
          path: artifacts/offline
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: maps-*
          path: artifacts/maps
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: withml-*
          path: artifacts/withml
          merge-multiple: true
      - name: List downloaded artifacts
        run: find artifacts -name "*.apk" -type f | sort
      - name: Generate changelog
        run: |
          generate_table() {
            local dir="$1" tag="$2"
            echo "| Architecture | Download | SHA256 |"
            echo "|:---|:---|:---|"
            find "$dir" -name "*.apk" -type f | sort | while IFS= read -r apk; do
              local name hash url arch
              name=$(basename "$apk")
              hash=$(sha256sum "$apk" | awk '{print $1}')
              url="https://github.com/IacobIonut01/ReFra/releases/download/${tag}/${name}"
              case "$name" in
                *-arm64-v8a-release.apk) arch="arm64-v8a" ;;
                *-armeabi-v7a-release.apk) arch="armeabi-v7a" ;;
                *-x86_64-release.apk) arch="x86_64" ;;
                *-x86-release.apk) arch="x86" ;;
                *-universal-release.apk) arch="Universal" ;;
                *) arch="Unknown" ;;
              esac
              echo "| ${arch} | [Click Here](${url}) | \`${hash}\` |"
            done
          }

          TAG="${VERSION}-nightly"
          CHANGELOG="${VERSION}-nightly-changelog.txt"

          cat .github/VARIANT_INFO.md >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"

          echo "### Standard (NoML)" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"
          generate_table "artifacts/maps" "$TAG" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"

          echo "### Offline (NoML)" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"
          generate_table "artifacts/offline" "$TAG" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"

          echo "### Offline (WithML)" >> "$CHANGELOG"
          echo "" >> "$CHANGELOG"
          generate_table "artifacts/withml" "$TAG" >> "$CHANGELOG"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }} Nightly Release
          body_path: ${{ env.VERSION }}-nightly-changelog.txt
          prerelease: true
          tag_name: ${{ env.VERSION }}-nightly
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
